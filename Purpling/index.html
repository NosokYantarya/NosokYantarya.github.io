<!DOCTYPE html>

<style>
    .Circle {
        position: absolute;
        border-radius: 100%;
        background-color: white;
    }
</style>

<script>
const R = 128;
const G = 0;
const B = 128;

const ChangeRange = 0.5;
const BasePercent = 50;

const BG = document.querySelector("body");

const CirclesStartingDiameter = 10;
const CirclesGrowthRate = 0.1;
const CircleFadeRate = 0.1;
const CircleUpdateDelay = 50;

var Circles = [];

function RandomInRange(min, max) {
    return (Math.random() * (max - min)) + min;
}

class Circle {
    constructor(x, y) {
        console.log(`Created circle at ${x} ${y}`);
        this.Diameter = CirclesStartingDiameter;
        this.PosX = x
        this.PosY = y
        this.Opacity = 100;
        this.GrowthRate = 0.4
        //RandomInRange(25,50) / 100;
        this.FadeRate = -0.1
        //RandomInRange(1,30) / 100 * -1;
        this.Finished = false;
        
        let NewCircle = document.createElement("div");
        NewCircle.className = "Circle";
        BG.appendChild(NewCircle);
        this.Element = NewCircle;
        this.UpdateSize();
        this.ChangeColour(CalculateColour(x, y, true));
    }

    ChangeColour(hex) {
        this.Element.style.backgroundColor = hex
    }
    
    UpdateSize() {
        this.Element.style.width = `${this.Diameter}px`;
        this.Element.style.height = `${this.Diameter}px`;
        this.Element.style.left = `${this.PosX - this.Diameter / 2}px`;
        this.Element.style.top = `${this.PosY - this.Diameter / 2}px`;
    }
    
    UpdateOpacity() {
        this.Element.style.opacity = `${this.Opacity}%`;
    }
    
    ChangeSize(value) {
        this.Diameter += value;
        this.UpdateSize();
    }
    
    ChangeOpacity(value) {
        this.Opacity += value;
        this.UpdateOpacity();
    }
    
    Update(deltaTime) {
        if(this.Opacity < 0) {
            this.Finished = true;
            this.Element.remove()
            return;
        }
        this.ChangeSize(this.GrowthRate * deltaTime);
        this.ChangeOpacity(this.FadeRate * deltaTime);
    }
}

function UpdateCircles() {
    for(i = 0; i < Circles.length; i++) {
        if(Circles[i].Finished) {
            Circles.splice(i, 1);
            i--;
            console.log("Deleted circle");
        }
        else {
            Circles[i].Update(CircleUpdateDelay);
        }
    }
}

function OnClick(event) {
    /*
    NewCircle = document.createElement("div");
    NewCircle.className = "Circle";
    NewCircle.style.left = `${event.clientX - CirclesStartingHeight / 2}px`;
    NewCircle.style.top = `${event.clientY - CirclesStartingWidth / 2}px`;
    BG.appendChild(NewCircle);
    */
   Circles.push(new Circle(event.clientX, event.clientY))
}

function CalculateColour(x, y, reverse = false) {
    let ScrWidth = document.documentElement.clientWidth;
    let ScrHeight = document.documentElement.clientHeight;

    let ROffset = (x / (ScrWidth / 2) - 1.0) * ChangeRange;
    let BOffset = (y / (ScrHeight / 2) - 1.0) * ChangeRange;

    let RPercentage = 1 + (ROffset * (reverse? -1 : 1));
    let BPercentage = 1 + (BOffset * (reverse? -1 : 1));
    //BG.innerText = `X and Y: ${x} ${y} \nOffset: ${ROffset} ${BOffset} \nPercents: ${RPercentage} ${BPercentage}`;
    let NewR = Math.min(255, Math.max(Math.trunc(R * RPercentage)));
    let NewG = G;
    let NewB = Math.min(255, Math.max(Math.trunc(B * BPercentage)));

    let Hex = "#" + ((NewR << 16) | (NewG << 8) | NewB).toString(16).padStart(6, "0");
    return Hex;
}

function OnMouseMove(event) {
    let MouseX = event.clientX;
    let MouseY = event.clientY;
    
    BGColour = CalculateColour(MouseX, MouseY);
    //BG.innerText = BGColour
    BG.style.backgroundColor = BGColour;

    CirclesColour = CalculateColour(MouseX, MouseY, true);
    Circles.forEach(element => {
        element.ChangeColour(CirclesColour)
    });
}

setInterval(UpdateCircles, 50);
document.addEventListener("click", OnClick);
document.addEventListener("mousemove", OnMouseMove);
//document.addEventListener("touchmove", OnMouseMove);
</script>
